bebbo_serializer.v1_check_update:
  path: '/api/check-update/{country}'
  defaults:
    _controller: '\Drupal\bebbo_serializer\Controller\CheckUpdateController::checkUpdate'
    _title: 'Check Update (V1)'
  requirements:
    # Public endpoint for the legacy app. Not under /v2/api, so the
    # bebbo_api_security JWT subscriber never matches it.
    _access: 'TRUE'
  methods: [GET]

bebbo_serializer.v2_check_update:
  path: '/v2/api/check-update/{country}'
  defaults:
    _controller: '\Drupal\bebbo_serializer\Controller\CheckUpdateController::checkUpdate'
    _title: 'Check Update (V2)'
  requirements:
    # Public route; the bebbo_api_security subscriber enforces JWT because
    # the path matches the protected /v2/api/* pattern.
    _access: 'TRUE'
  methods: [GET]
  options:
    # JWT-gated: never serve from the internal page cache. Otherwise a valid
    # token's 200 would be cached by URL and replayed to unauthenticated
    # requests, bypassing the bebbo_api_security subscriber (which runs after
    # the page-cache middleware).
    no_cache: TRUE
