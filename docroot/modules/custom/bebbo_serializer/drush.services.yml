services:
  bebbo_serializer.embedded_images_commands:
    class: Drupal\bebbo_serializer\Commands\EmbeddedImagesCommands
    arguments:
      - '@entity_type.manager'
      - '@bebbo_serializer.body_image_processor'
    tags:
      - { name: drush.command }

  bebbo_serializer.body_rendered_commands:
    class: Drupal\bebbo_serializer\Commands\BodyRenderedCommands
    arguments:
      - '@entity_type.manager'
      - '@bebbo_serializer.body_image_processor'
      - '@request_stack'
    tags:
      - { name: drush.command }

  bebbo_serializer.file_paths_fix_commands:
    class: Drupal\bebbo_serializer\Commands\FilePathsFixCommands
    arguments:
      - '@entity_type.manager'
      - '@file_system'
    tags:
      - { name: drush.command }

  bebbo_serializer.remove_tr_translations:
    class: Drupal\bebbo_serializer\Commands\RemoveTrTranslationsCommands
    arguments:
      - '@entity_type.manager'
      - '@database'
    tags:
      - { name: drush.command }
