services:
  bebbo_serializer.encoder.bebbo_json:
    class: Drupal\bebbo_serializer\Encoder\BebboEncoder
    tags:
      - { name: encoder, format: bebbo_json }

  bebbo_serializer.request_format_subscriber:
    class: Drupal\bebbo_serializer\EventSubscriber\RequestFormatSubscriber
    tags:
      - { name: event_subscriber }

  bebbo_serializer.etag_response_subscriber:
    class: Drupal\bebbo_serializer\EventSubscriber\EtagResponseSubscriber
    tags:
      - { name: event_subscriber }

  bebbo_serializer.api_vary_response_subscriber:
    class: Drupal\bebbo_serializer\EventSubscriber\ApiVaryResponseSubscriber
    tags:
      - { name: event_subscriber }

  bebbo_serializer.body_image_processor:
    class: Drupal\bebbo_serializer\Service\BodyImageProcessor
    arguments:
      - '@renderer'
      - '@entity_type.manager'
      - '@file_url_generator'

  cache.bebbo_api_fragment:
    class: Drupal\Core\Cache\CacheBackendInterface
    tags:
      - { name: cache.bin }
    factory: ['@cache_factory', 'get']
    arguments: [bebbo_api_fragment]

  bebbo_serializer.row_fragment_cache:
    class: Drupal\bebbo_serializer\Cache\RowFragmentCache
    arguments:
      - '@cache.bebbo_api_fragment'
      - '@renderer'
