  revision_id: null
  rev_id_current: null
  fields:
    body:
    - value: <div class="scroll-menu" id="bebbo_families"><h2>Bebbo is transforming parenting and expanding support for parents across the globe.</h2><p>Discover how Bebbo is making a change for parents
        in different countries:</p><div class="container"><div class="row"><div class="col-md-3"><div class="featured-bb-image"><drupal-media data-entity-type="media" data-entity-uuid="c47dd153-b5f9-4227-91de-403324b519e4">&nbsp;</drupal-media></div><div
        class="featured-bb-text"><h6>Serbia:&nbsp;<br>From Advice<br>to Reassurance</h6><div class="content-bb"><a href="https://www.unicef.org/serbia/en/stories/from-advice-to-reassurance">Read more...</a></div></div></div><div
        class="col-md-3"><div class="featured-bb-image"><drupal-media data-entity-type="media" data-entity-uuid="72ed87e1-c6a9-4c69-862d-dc4b01847708">&nbsp;</drupal-media></div><div class="featured-bb-text"><h6>Moldova:&nbsp;<br>Happy
        Bebbo Fest!</h6><div class="content-bb"><a href="https://www.unicef.org/moldova/en/stories/bebbo-fest-event-parents-and-children-marked-music-and-outdoor-activities">Read more...</a></div></div></div><div
        class="col-md-3"><div class="featured-bb-image"><drupal-media data-entity-type="media" data-entity-uuid="3b1ea029-94c8-45e8-9702-e8ffeb8c5023">&nbsp;</drupal-media></div><div class="featured-bb-text"><h6>Montenegro:&nbsp;<br>A
        Father's Journey with Bebbo</h6><div class="content-bb"><a href="https://www.unicef.org/montenegro/en/stories/bojan-bebbo-reliable-teacher">Read more...</a></div></div></div><div class="col-md-3"><div
        class="featured-bb-image"><drupal-media data-entity-type="media" data-entity-uuid="da430250-fb2f-4afb-b95c-7730e8bf19de">&nbsp;</drupal-media></div><div class="featured-bb-text"><h6>Romania:&nbsp;<br>Bebbo,
        a Helping Hand<br>for Mothers</h6><div class="content-bb"><a href="https://www.unicef.org/romania/press-releases/mothers-make-80-romanian-users-bebbo-unicefs-free-parenting-app">Read more...</a></div></div></div></div></div></div>
