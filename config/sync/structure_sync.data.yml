- info: BLOCK 6 - BEBBO FEATURES
  langcode: en
  uuid: b24e81f4-764d-47d8-88d8-7fd8109637ba
  bundle: basic
  revision_id: null
  rev_id_current: null
  fields:
    body:
    - value: <div class="scroll-menu" id="features"><h2>How does Bebbo help parents raise thriving children?</h2><p>The Bebbo App has a huge range of helpful features empowering parents to make the right
        decisions when it comes to the care and development of their child. Encouraging parents to engage daily with suggested articles and games that will help their little ones hit those key development
        milestones while growing healthy and happy.</p><p>&nbsp;</p><div><div class="container"><div class="row"><div class="col-md-4"><div class="featured-bb-image"><drupal-media data-entity-type="media"
        data-entity-uuid="01cbf82a-d28f-48da-ad6d-2510bc9e3308" data-align="center">&nbsp;</drupal-media></div><div class="featured-bb-text"><div class="head-text">Suggested Daily Reads</div><div class="content-bb">Every
        day the app will suggest a daily game and an article from a rich library of parenting advice written by experts, covering a large range of topics available in the app, such as baby weaning and early
        learning. All advice can be quickly saved as favorites and shared with other parents or friends.</div></div></div><div class="col-md-4"><div class="featured-bb-image"><drupal-media data-entity-type="media"
        data-entity-uuid="03f1910d-4925-4722-bb5c-b14ab4c38ec2" data-align="center">&nbsp;</drupal-media></div><div class="featured-bb-text"><div class="head-text">Parenting tips for playing with your children</div><div
        class="content-bb">Bebbo offers plenty of ideas on how to engage in playful interaction with children through games that will stimulate learning and development. Parents will be able to choose games
        that support the development of motor and socio-emotional skills, language, communication and cognition.</div></div></div><div class="col-md-4"><div class="featured-bb-image"><drupal-media data-entity-type="media"
        data-entity-uuid="f6a528e2-8e04-4379-9de1-498e2548e627" data-align="center">&nbsp;</drupal-media></div><div class="featured-bb-text"><div class="head-text">Child development tracker</div><div class="content-bb">This
        tool is easy-to-use and helps parents track their child’s progress in reaching the milestones recommended for his/her age. It will assist parents on how to support development through play.</div></div></div></div><div
        class="row"><div class="col-md-4"><div class="featured-bb-image"><drupal-media data-entity-type="media" data-entity-uuid="7ed6f952-73e8-4c60-b498-d7b10f58daa1" data-align="center">&nbsp;</drupal-media></div><div
        class="featured-bb-text"><div class="head-text">Child’s vaccinations</div><div class="content-bb">A handy vaccination record is available for parents to easily track and record your child’s vaccinations.</div></div></div><div
        class="col-md-4"><div class="featured-bb-image"><drupal-media data-entity-type="media" data-entity-uuid="db1b171e-d440-447f-a678-ab643fe5404e" data-align="center">&nbsp;</drupal-media></div><div
        class="featured-bb-text"><div class="head-text">Child’s health check-up</div><div class="content-bb">The health check-up tool allows parents to note down information from their child’s doctor visits,
        as well as setting reminders for doctor’s appointments.</div></div></div><div class="col-md-4"><div class="featured-bb-image"><drupal-media data-entity-type="media" data-entity-uuid="009d229b-7866-4adc-bbbc-7c13511d0b3c"
        data-align="center">&nbsp;</drupal-media></div><div class="featured-bb-text"><div class="head-text">Child’s growth tracker</div><div class="content-bb">This tool allows parents to track their child’s
        measurements such as height and weight.</div></div></div></div></div></div></div>
      summary: ''
      format: admin_full_html
