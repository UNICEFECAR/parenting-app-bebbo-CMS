- info: BLOCK 8 - BEBBO CONTACT
  langcode: en
  uuid: 4c483be0-8646-4f5f-89ed-ac2d57ec85e4
  bundle: basic
  revision_id: null
  rev_id_current: null
  fields:
    body:
    - value: <p>Stay connected and never miss an update! <a href="https://slmls.mjt.lu/wgt/slmls/xxow/form?c=4b84a8a2">Subscribe to the Bebbo newsletter</a> for app features and news on how we're shaping
        the future of parenting support.</p><drupal-media data-entity-type="media" data-entity-uuid="981efb53-bbb7-4976-924b-f9d199700f27" data-align="center">&nbsp;</drupal-media><p>Support the development
        and growth of Bebbo and become UNICEF's partner in empowering millions of parents worldwide through innovation! For more information please contact <a href="mailto:admin@bebbo.app">admin@bebbo.app</a></p>
